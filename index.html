<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Basic Reset */
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        main {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        header h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 2px solid #ccc;
            font-size: 14px;
        }

        /* Validation Feedback */
        input:valid {
            border-color: green;
        }

        input:invalid {
            border-color: red;
        }

        small {
            color: #777;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>

<body>
<main>
    <header>
        <h1>Student Registration</h1>
    </header>

    <form>
        <!-- Name -->
        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="name"
            required
            pattern="[A-Za-z ]{3,}"
            placeholder="Enter your name">
        <small>Minimum 3 letters, alphabets only</small>

        <!-- Email -->
        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="example@email.com">

        <!-- Age -->
        <label for="age">Age</label>
        <input
            type="number"
            id="age"
            name="age"
            required
            min="18"
            max="60"
            placeholder="Enter your age">
        <small>Age must be between 18 and 60</small>

        <!-- Submit -->
        <button type="submit">Register</button>
    </form>

    <footer>
        HTML5 Validation Demo
    </footer>
</main>
</body>
</html>
